];
const inGroup=(n,label)=>label==='Todas'||groups.find(g=>g.label===label)?.cats.includes(n.categoria);
const symbols={'Mundo':'◉','España y Europa':'✧','Geopolítica':'◎','Economía':'⌁','Tecnología':'✳','Ciencia':'✶','Salud':'✚','Medioambiente':'❧','Sociedad':'◌','Cultura':'✎','Noticias positivas':'✿'};
const tones={'Mundo':'mundo','España y Europa':'europa','Geopolítica':'geopolitica','Economía':'economia','Tecnología':'tecnologia','Ciencia':'ciencia','Salud':'salud','Medioambiente':'medioambiente','Sociedad':'sociedad','Cultura':'cultura','Noticias positivas':'positivas'};
const colors={'Local':'#8A663E','Mundo':'#367b76','España y Europa':'#77749c','Geopolítica':'#818f80','Economía':'#ba9b64','Tecnología':'#9783ad','Ciencia':'#6793ab','Salud':'#8eae8a','Medioambiente':'#739b74','Sociedad':'#bd796f','Cultura':'#bb9a6e','Noticias positivas':'#8eae59'};
const get=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};
const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val))}catch{}};
let favoriteIds=get('perspectiva-favorites',[]),feedURL=get('perspectiva-feed-url','');
const fav=id=>favoriteIds.includes(id),worldStories=()=> (state.edition.noticias||[]).filter(n=>n.categoria!=='Deportes'),localStories=()=> (state.edition.noticias_locales||[]).filter(n=>n.categoria==='Local'),stories=()=>[...worldStories(),...localStories()],find=id=>stories().find(x=>x.id===id);

const expt=txt=>ESC(txt||'');
const screenTop=()=>window.scrollTo({top:0,behavior:'instant'});
function valid(obj){if(!obj||obj.schema_version!==1||obj.tipo!=='real'||!Array.isArray(obj.noticias))throw Error('Formato inválido: se requiere una edición real con schema_version=1 y noticias[]');for(const n of obj.noticias){if(!n.id||!n.titulo||!n.categoria||!n.que_ha_pasado||!Array.isArray(n.fuentes))throw Error('Una noticia no tiene los campos obligatorios');if(n.categoria==='Deportes')throw Error('Esta versión no publica noticias deportivas');if(n.fuentes.some(s=>!safeHref(s.url)))throw Error('Cada fuente real debe contener un enlace HTTPS');if(n.fuentes.some(s=>s.orientacion?.etiqueta&&(!safeHref(s.orientacion.referencia)||!s.orientacion.fecha||!s.orientacion.proveedor||!s.orientacion.marco)))throw Error('Una orientación editorial carece de referencia o fecha');if(n.analisis_verificado && (new Set(n.fuentes.map(s=>s.medio.toLowerCase().trim())).size<3 || !n.comparacion?.coincidencias?.length||!n.comparacion?.diferencias?.length||!n.comparacion?.limites?.length))throw Error('El análisis comparativo exige al menos tres medios distintos, coincidencias, diferencias y límites');}return obj;}

function metabits(n){return `<span class="meta"><span style="color:${colors[n.categoria]||'#337263'}">${ESC(n.ambito_local?('Local · '+n.ambito_local):n.categoria)}</span><i class="dot"></i>${n.fuentes.length} ${n.fuentes.length===1?'fuente':'fuentes'} <i class="dot"></i>${ESC(n.fecha||'')}</span>`}
function art(n){return `<div class="art tone-${tones[n.categoria]||'mundo'}"><span class="art-tag">${ESC(n.etiqueta_editorial||n.categoria)}</span><div class="art-inner"><div class="art-glyph">${symbols[n.categoria]||'◉'}</div></div></div>`}
function shortcuts(){return '';}
function topicTiles(){return `<section class="topic-grid" aria-label="Explorar secciones">${groups.map(g=>`<button class="topic-tile" data-action="category" data-cat="${ESC(g.label)}"><span class="topic-icon" style="background:${g.color}">${g.icon}</span><span class="topic-name">${ESC(g.label)}</span><span class="topic-desc">${ESC(g.desc)}</span><span class="topic-count">${worldStories().filter(n=>inGroup(n,g.label)).length} ${worldStories().filter(n=>inGroup(n,g.label)).length===1?'noticia':'noticias'} <span aria-hidden="true">↗</span></span></button>`).join('')}</section>`}
function leadCard(n){return `<button class="lead-card" data-action="open" data-id="${ESC(n.id)}"><div class="rank-ribbon">01 · NOTICIA DE APERTURA</div>${art(n)}<div class="lead-copy">${metabits(n)}<h2 class="title-lg">${ESC(n.titulo)}</h2><p class="deck">${ESC(n.entradilla)}</p><span class="read-more">Leer explicación y fuentes <span aria-hidden="true">→</span></span></div></button>`}
function sideCard(n,rank){return `<button class="side-card" data-action="open" data-id="${ESC(n.id)}"><span class="rank-inline">${String(rank).padStart(2,'0')} · EN PORTADA</span>${metabits(n)}<h3>${ESC(n.titulo)}</h3><p class="source-count">Leer explicación →</p></button>`}
function storyCard(n){return `<button class="story-card" data-action="open" data-id="${ESC(n.id)}"><span class="story-deco" style="background:${colors[n.categoria]||'#286559'}"></span><div class="story-content">${metabits(n)}<h3>${ESC(n.titulo)}</h3><p>${ESC(n.entradilla)}</p><span class="story-footer"><span>Explicación y artículos originales</span><span>→</span></span></div></button>`}
function home(){const all=worldStories();const featured=all.filter(n=>n.portada).sort((a,b)=>(a.posicion_portada||999)-(b.posicion_portada||999));const top=featured.length?featured.slice(0,3):all.slice(0,3);const lead=top[0],side=top.slice(1,3);const rest=all.filter(n=>!top.includes(n));const positives=rest.filter(n=>n.categoria==='Noticias positivas').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));const more=rest.filter(n=>n.categoria!=='Noticias positivas').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));return `<div class="edition-header"><div><span class="kicker">Edición del ${ESC(state.edition.fecha_edicion)}</span><h1 class="heading">Hoy, con perspectiva.</h1><p class="subheading">${all.length} noticias de esta edición · Resúmenes y enlaces originales</p></div></div><div class="section-head top-section"><div><span class="kicker">Selección editorial</span><h2>En portada</h2></div><span class="tiny">${top.length} noticias destacadas</span></div>${lead?`<section class="lead-grid">${leadCard(lead)}<div class="side-list">${side.map((n,i)=>sideCard(n,i+2)).join('')}</div></section>`:'<div class="empty"><h3>No hay noticias publicadas</h3>Conecta una edición desde el apartado Edición.</div>'}${more.length?`<div class="section-head"><div><span class="kicker">Actualidad</span><h2>Más noticias</h2></div><button class="ghost" data-action="browse">Ver todas →</button></div><section class="story-grid">${more.map(storyCard).join('')}</section>`:''}${positives.length?`<div class="section-head positive-head"><div><span class="kicker">Historias constructivas</span><h2>Noticias positivas</h2></div><button class="ghost" data-action="category" data-cat="Positivas">Ver sección →</button></div><section class="story-grid positive-grid">${positives.map(storyCard).join('')}</section>`:''}`}
function browse(){let q=state.search.toLocaleLowerCase('es').trim(),all=worldStories().filter(n=>inGroup(n,state.cat) && (!q||[n.titulo,n.entradilla,n.categoria,n.region,...(n.etiquetas||[])].join(' ').toLocaleLowerCase('es').includes(q))).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')),isAll=state.cat==='Todas';return `<div class="browse-top"><span class="kicker">Toda la edición · por fecha</span><h1 class="heading">${isAll?'Explora las noticias':ESC(state.cat)}</h1><p class="subheading">${isAll?'Cinco secciones, una búsqueda. La portada está ordenada editorialmente. Aquí encontrarás todas las noticias por fecha.':all.length+' noticias de esta sección, ordenadas por fecha.'}</p></div>${!isAll?`<button class="back" data-action="alltopics">← Todos los temas</button>`:''}<input class="searchline" id="search" placeholder="Buscar noticias o regiones…" value="${ESC(state.search)}" aria-label="Buscar noticias"/>${isAll&&!q?topicTiles():''}${all.length?`<div class="section-head"><div><span class="kicker">${isAll?'Edición completa':'En esta sección'}</span><h2>${isAll?'Todas las noticias':'Lecturas disponibles'}</h2></div><span class="tiny">${all.length} ${all.length===1?'resultado':'resultados'}</span></div><section class="story-grid">${all.map(storyCard).join('')}</section>`:'<div class="empty"><h3>Sin resultados</h3>Prueba otra búsqueda o sección.</div>'}`}
function local(){const items=localStories(),scope=state.localScope,chosen=scope==='Todas'?items:items.filter(n=>n.ambito_local===scope);const tabs=localScopes.map(x=>`<button class="pill ${scope===x?'active':''}" data-action="local-scope" data-scope="${ESC(x)}" aria-pressed="${scope===x?'true':'false'}">${ESC(x)}</button>`).join('');const box=(area)=>{let list=chosen.filter(n=>n.ambito_local===area).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));return `<div class="section-head"><div><span class="kicker">${area==='Sant Andreu'?'Tu distrito':'Cerca de ti'}</span><h2>${ESC(area)}</h2></div><span class="tiny">${list.length} ${list.length===1?'noticia':'noticias'}</span></div>${list.length?`<section class="story-grid">${list.map(storyCard).join('')}</section>`:'<div class="empty">Sin noticias recientes verificadas en este ámbito.</div>'}`};return `<div class="edition-header"><div><span class="kicker">Edición local · ${ESC(state.edition.fecha_edicion||'')}</span><h1 class="heading">Lo que pasa cerca.</h1><p class="subheading">España, Catalunya, Barcelona y el distrito de Sant Andreu, con prioridad para las noticias de barrio. La sección mundial sigue independiente.</p></div></div><nav class="local-scopes" aria-label="Filtrar noticias locales">${tabs}</nav>${scope==='Todas'?localOrder.map(box).join(''):box(scope)}<p class="footer">Edición local manual: las alertas de transporte, seguridad y meteorología pueden haber cambiado desde su publicación. Consulta las fuentes operativas oficiales para información en tiempo real.</p>`}
function saved(){let all=stories().filter(n=>fav(n.id));return `<span class="kicker">Tu selección</span><h1 class="heading">Lecturas guardadas.</h1><p class="subheading">Se guardan en este navegador, no en GitHub.</p><div class="listcompact" style="margin-top:22px">${all.map(n=>`<button class="compact-card" data-action="open" data-id="${ESC(n.id)}"><div>${metabits(n)}<h3>${ESC(n.titulo)}</h3></div><span>↗</span></button>`).join('')||'<div class="empty"><h3>Todavía no hay noticias guardadas.</h3>Pulsa el corazón dentro de cualquier noticia.</div>'}</div>`}
function sourceCard(s){let ori=s.orientacion,ref=ori&&safeHref(ori.referencia);return `<article class="coverage"><div class="coverage-top"><b>${ESC(s.medio)}</b><span class="badge">${ESC(s.pais||'Origen no indicado')}</span></div><div class="source-lbl">${s.titular_traducido?'Titular presentado en español':'Titular original'}</div><h4>${ESC(s.titular)}</h4><p>${ESC(s.extracto)}</p>${ori?.etiqueta&&ref?`<div class="bias">Orientación editorial: ${ESC(ori.etiqueta)} · ${ESC(ori.proveedor)} · <a href="${ESC(ref)}" target="_blank" rel="noopener noreferrer">Ver método y clasificación ↗</a></div>`:''}<a class="original-link" href="${ESC(safeHref(s.url))}" target="_blank" rel="noopener noreferrer">Abrir noticia original en ${ESC(s.medio)} ↗</a></article>`}
function bullet(arr){return (arr||[]).map(s=>`<li>${ESC(s)}</li>`).join('')}
function detail(n){const count=new Set(n.fuentes.map(s=>(s.medio||'').trim().toLowerCase())).size;const canCompare=count>=3 && n.analisis_verificado===true && n.comparacion?.coincidencias?.length && n.comparacion?.diferencias?.length && n.comparacion?.limites?.length;return `<div class="detail-wrap"><button class="back" data-action="back">← Volver a la edición</button><article><div class="detail-top"><span class="kicker">${ESC(n.categoria)} · ${ESC(n.region)}</span><h1 class="detail-title">${ESC(n.titulo)}</h1><div class="detail-lead">${ESC(n.entradilla)}</div><div class="detail-stats"><span>Noticia: ${ESC(n.fecha||state.edition.fecha_edicion)}</span><span>${count} ${count===1?'medio':'medios'} consultados</span></div><div class="direct-sources"><strong>Amplía la noticia en sus fuentes</strong><div class="source-buttons">${n.fuentes.map(s=>`<a href="${ESC(safeHref(s.url))}" class="source-direct" target="_blank" rel="noopener noreferrer">${ESC(s.medio)} <span aria-hidden="true">↗</span></a>`).join('')}</div></div><button class="small-btn save-btn" data-action="favorite" data-id="${ESC(n.id)}">${fav(n.id)?'♥ Guardada':'♡ Guardar noticia'}</button></div><div class="two-col"><div><section class="body-block"><h3>Qué ha pasado</h3><p>${ESC(n.que_ha_pasado)}</p></section><section class="body-block"><h3>El contexto</h3><p>${ESC(n.contexto)}</p></section><section class="body-block"><h3>Por qué importa</h3><p>${ESC(n.por_que_importa)}</p></section><div class="note">Síntesis editorial de esta edición. Consulta los artículos enlazados para ampliar y contrastar.</div></div><aside class="sidebar"><h4>Lo que sabemos</h4><ul class="pointlist">${bullet(n.que_se_sabe)}</ul><hr style="border:0;border-top:1px solid #e4e8e0;margin:15px 0"><h4>Qué sigue abierto</h4><ul class="pointlist">${bullet(n.que_falta)}</ul></aside></div><section id="coberturas"><div class="compare-head"><div><span class="kicker">Fuentes originales</span><h2>${canCompare?'Tres o más perspectivas documentadas':'Artículos consultados'}</h2></div><span class="tiny">${count} ${count===1?'medio':'medios'}</span></div><div class="coverage-grid ${canCompare?'':'coverage-compact'}">${n.fuentes.map(sourceCard).join('')}</div>${canCompare?`<div class="comparison"><span class="kicker">Análisis contrastado</span><h3>Qué aportan las distintas coberturas</h3><div class="cmpcols"><div><b>HECHOS COINCIDENTES</b><ul class="pointlist" style="margin-top:12px">${bullet(n.comparacion.coincidencias)}</ul></div><div><b>DIFERENCIAS VERIFICADAS</b><ul class="pointlist" style="margin-top:12px">${bullet(n.comparacion.diferencias)}</ul></div></div><hr style="border:0;border-top:1px solid #d7ded5;margin:17px 0"><b>LÍMITES DEL ANÁLISIS</b><ul class="pointlist" style="margin-top:9px">${bullet(n.comparacion.limites)}</ul></div>`:''}</section></article></div>`}
function settings(){return `<span class="kicker">Cómo funciona</span><h1 class="heading">Una edición. Un archivo.</h1><p class="subheading">Desde esta conversación se prepara y publica el JSON cuando tú lo solicites. Perspectiva se limita a mostrarlo.</p><div class="method-table" style="margin-top:24px"><div class="method-panel"><h3>01. La portada</h3><p>Tres noticias de apertura elegidas editorialmente y ordenadas explícitamente; después aparecen las demás noticias por fecha, con las positivas en su propia sección.</p></div><div class="method-panel"><h3>02. Amplía cada noticia</h3><p>Cada ficha tiene enlaces directos a sus artículos originales, al principio y en la sección de fuentes.</p></div><div class="method-panel"><h3>03. Comparaciones</h3><p>Solo aparecen cuando contamos con tres o más medios diferentes y una comparación editorial revisada. Tener dos enlaces no justifica inventar diferencias.</p></div><div class="method-panel"><h3>04. Orientación editorial</h3><p>Solo aparece cuando hay una clasificación externa documentada. Nunca se confunde la orientación habitual del medio con la de un artículo concreto.</p></div></div><div class="setting-card"><h2>Conectar una edición</h2><p>Ahora ves la edición del ${ESC(state.edition.fecha_edicion)}. Cuando haya GitHub Pages, conecta la URL pública HTTPS del JSON; hasta entonces puedes importar archivos actualizados.</p><label for="feed" class="kicker">URL PÚBLICA DEL JSON</label><input class="input" id="feed" type="url" placeholder="https://…/data/edicion.json" value="${ESC(feedURL)}"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" data-action="setfeed">Guardar URL y actualizar</button><button class="ghost" data-action="reload">↻ Actualizar</button><button class="ghost" data-action="reset">Volver a edición incluida</button></div><hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><label for="file" class="kicker">IMPORTAR EDICIÓN LOCAL</label><p>Selecciona un archivo <code>.json</code> con una edición real.</p><input id="file" class="file-input" type="file" accept=".json,application/json"><div id="errorbox">${state.error?`<div class="error-box">${ESC(state.error)}</div>`:''}</div></div>`}
function render(){let n=state.selected&&find(state.selected);$('#root').innerHTML= n?detail(n):state.view==='browse'?browse():state.view==='local'?local():state.view==='saved'?saved():state.view==='settings'?settings():home();$('#topclock').textContent=state.edition.fecha_edicion||'EDICIÓN PERSONAL';$('#status').textContent='● EDICIÓN '+String(state.edition.fecha_edicion||'').slice(5);document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('selected',!n&&b.dataset.tab===state.view));document.querySelectorAll('.desktop-nav button').forEach(b=>b.classList.toggle('selected',!n&&b.dataset.action===state.view));if(n)document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('selected',b.dataset.tab==='home'));}
function useEdition(data,origin){valid(data);state.edition=data;state.selected=null;state.view=origin==='importada'?'home':state.view;state.cat='Todas';state.error='';save('perspectiva-last-edition',data);save('perspectiva-last-origin',origin);render();screenTop()}
async function update(explicit){let url=feedURL||(location.protocol.startsWith('http')?'./data/edicion.json':'');if(!url){if(explicit){state.error='Todavía no hay una URL pública. Puedes leer la edición incluida o importar otra.';state.view='settings';render()}return}try{if(!safeHref(new URL(url,location.href).href)&&!url.startsWith('./'))throw Error('Usa una URL HTTPS pública');let real=new URL(url,location.href);if(!['https:','http:'].includes(real.protocol)|| (real.protocol==='http:'&&real.hostname!=='localhost'&&real.hostname!=='127.0.0.1'))throw Error('La URL debe ser HTTPS');let r=await fetch(real.href+(real.search?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`No se pudo descargar la edición (HTTP ${r.status})`);useEdition(await r.json(),url)}catch(e){state.error='No se ha actualizado: '+e.message+'. Se mantiene la edición anterior.';if(explicit){state.view='settings';render()}else console.warn(state.error)}}
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-action]');if(!btn)return;let act=btn.dataset.action,id=btn.dataset.id;if(act==='open'){state.selected=id;history.pushState({id},'',`#${encodeURIComponent(id)}`);render();screenTop()}else if(act==='back'){state.selected=null;history.replaceState(null,'',location.pathname+location.search);render();screenTop()}else if(act==='home'||act==='local'||act==='browse'||act==='saved'||act==='settings'){state.selected=null;state.view=act;state.cat=act==='browse'?'Todas':'Todas';render();screenTop()}else if(act==='local-scope'){state.localScope=localScopes.includes(btn.dataset.scope)?btn.dataset.scope:'Todas';render();screenTop()}else if(act==='category'){state.cat=btn.dataset.cat;state.selected=null;state.view='browse';render();screenTop()}else if(act==='alltopics'){state.cat='Todas';state.search='';state.view='browse';render();screenTop()}else if(act==='favorite'){favoriteIds=fav(id)?favoriteIds.filter(f=>f!==id):[...favoriteIds,id];save('perspectiva-favorites',favoriteIds);render()}else if(act==='setfeed'){feedURL=$('#feed').value.trim();if(feedURL && !/^https:\/\//i.test(feedURL)){state.error='Utiliza una URL HTTPS pública.';render();return}save('perspectiva-feed-url',feedURL);update(true)}else if(act==='reload'){state.error='';update(true)}else if(act==='reset'){feedURL='';save('perspectiva-feed-url','');state.edition=initialEdition;state.error='';save('perspectiva-last-edition',null);state.view='home';render();screenTop()}});
document.addEventListener('input',ev=>{if(ev.target?.id==='search'){state.search=ev.target.value;let pos=ev.target.selectionStart;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async ev=>{if(ev.target?.id==='file'){try{let file=ev.target.files?.[0];if(file)useEdition(JSON.parse(await file.text()),'importada')}catch(e){state.error='Archivo no válido: '+e.message;render()}}});
window.addEventListener('popstate',()=>{let id=decodeURIComponent(location.hash.slice(1));state.selected=find(id)?id:null;render()});
const cached=get('perspectiva-last-edition',null);if(cached){try{valid(cached);if(cached.actualizado_en>initialEdition.actualizado_en)state.edition=cached}catch{save('perspectiva-last-edition',null)}}let hash=decodeURIComponent(location.hash.slice(1));if(hash&&find(hash))state.selected=hash;render();if(feedURL||location.protocol.startsWith('http'))update(false);
})();
</script>
</body></html>
